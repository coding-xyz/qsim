site_name: qsim 文档
site_description: qsim 使用指南、实现 Wiki 与自动生成 API 参考
repo_name: qsim
use_directory_urls: false
docs_dir: docs/src
site_dir: docs/site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - gen-files:
      scripts:
        - docs/src/dev/gen_ref_pages.py
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_toc_entry: false
            docstring_style: google

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - 首页: index.md
  - 概览: wiki/overview.md
  - 基本用法: wiki/basic_usage.md
  - 任务配置: wiki/workflow_task_config.md
  - 设备配置: wiki/device_config.md
  - 脉冲配置: wiki/pulse_config.md
  - 求解器配置: wiki/solver_config.md
  - 可视化: wiki/visualization.md
  - 量子纠错: wiki/qec_analysis.md
  - 文件IO: wiki/io_session.md
  - 开发进度: wiki/gaps.md
  - API 参考:
      - 总览: api/index.md
      - analysis: api/analysis.md
      - backend: api/backend.md
      - circuit: api/circuit.md
      - common: api/common.md
      - engines: api/engines.md
      - pulse: api/pulse.md
      - qec: api/qec.md
      - session: api/session.md
      - ui: api/ui.md
      - workflow: api/workflow.md
